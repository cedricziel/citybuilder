<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32" shape-rendering="crispEdges">
<!-- Texture uses a 32x16 pattern so neighbouring tiles (offset by 32,16) line up without seams. -->
<defs>
  <pattern id="g" width="32" height="16" patternUnits="userSpaceOnUse">
    <rect width="32" height="16" fill="#86A040"/>
    <path d="M3,3 l2,-2 l1,2 M19,5 l2,-2 l1,2 M11,11 l2,-2 l1,2 M27,13 l2,-2 l1,2" stroke="#A8B852" stroke-width="1" fill="none"/>
    <path d="M8,6 l1,-1 M24,2 l1,-1 M16,14 l1,-1 M30,9 l1,-1" stroke="#5E7A30" stroke-width="1"/>
  </pattern>
</defs>
<path d="M32,0 L64,16 L32,32 L0,16Z" fill="url(#g)"/>
</svg>
