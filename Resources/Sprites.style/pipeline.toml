# Sprite generation pipeline configuration.
#
# This file pins every machine-readable parameter of the AI sprite
# pipeline that lives outside `world.md` and per-sprite catalog entries.
# Every value here is part of the prompt-hash cache key by way of the
# fixed-instructions string, so changes invalidate every cache entry
# (intentional — bumping the model SHOULD regenerate everything).

# OpenAI image model identifier. Prefer a dated snapshot of the form
# `gpt-image-<major>-<YYYY>-<MM>-<DD>` for reproducibility when one
# exists. Some model families (currently `gpt-image-1`) expose only a
# floating alias; in that case the alias is the identifier and the
# committed `_sheets/` carry the deterministic source-of-truth for
# offline regen instead.
#
# Currently pinned to `gpt-image-1`: it is the only OpenAI image model
# that supports `background: "transparent"` on /v1/images/{generations,
# edits}, which the pipeline requires. `gpt-image-2-2026-04-21` looked
# like the obvious successor but rejects `background: transparent`
# with `image_generation_user_error / invalid_value`.
model = "gpt-image-1"

# Default generated sheet size. Catalog entries MAY override via their
# YAML front matter (`sheet_size = "1536x512"`, etc.). At this size a
# 4×2 cell grid produces 384×512-pixel building cells that downsample
# cleanly to 128×170 canonical pixels.
sheet_default_size = "1536x1024"

# Default cell grid for a building-class sprite (cols x rows). Goods
# icons and ships override this via per-entry front matter.
cell_default_grid = "4x2"

# Background convention. The pipeline asks the image API for real PNG
# transparency via `background: "transparent"` on every call; the model
# is expected to return alpha = 0 outside the sprite silhouette. No
# chroma-key colour is reserved.
background = "transparent"

# Soft-alpha threshold applied after generation. Pixels with alpha
# below this value become fully transparent (0); pixels at or above
# become fully opaque (255). Hard binary alpha keeps pixel-art edges
# crisp after nearest-neighbour downsampling.
alpha_threshold = 128

# Content gate (`make sprites-verify`): maximum chi-squared distance
# between an animation frame's or variant's 16-bin palette histogram
# and its base sprite's. Calibrated on the e57823e atlas: known-good
# frames (grass, road variants, lumberjack, mountain-v3) stay below
# 0.3; the broken water and beach frames land above it.
coherence_max_distance = 0.3

# Concurrent /v1/images/edits calls in a single `make sprites` run.
# Tuned by the spike at 4 — within tier rate limits, completes a
# full regen in ~2 minutes wall-clock. Tighten to 1 if a contributor
# hits 429s.
[concurrency]
max_inflight = 4
