# yaml-language-server: $schema=./schema/index.schema.json
# Load order is case order: packs top to bottom, then items top to bottom.
# Good, Culture, Tech and Age order feed the simulation; reorder only on purpose.
# Keep `packs` the last key: the fixture-pack check appends to this list.
schemaVersion: 1
packs:
  - core                          # base goods, buildings and regular techs
  - cultures/northern-european
  - cultures/mediterranean
  - cultures/east-asian
  - cultures/middle-eastern
  - ages                          # ages, era techs, age signature buildings
  - orders                        # timed requests from the crown and rival towns
  - events                        # seasonal events: fire, blight, fever, festival
  - campaigns                     # campaigns and their chapters
