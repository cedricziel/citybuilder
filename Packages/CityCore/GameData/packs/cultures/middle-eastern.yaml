# yaml-language-server: $schema=../../schema/pack.schema.json
# Spec: cultures, culture-content, culture-signatures
defaults:
  garden: &garden
    category: gather
    footprint: [2, 2]
    cost: 60
    buildTicks: 25
    storage: 16
    materials: { wood: 2 }
    unlockedBy: cultivation
  producer: &producer
    category: craft
    footprint: [2, 2]
    cost: 120
    upkeep: 1
    buildTicks: 30
    storage: 16
    materials: { wood: 3, planks: 3 }
    unlockedBy: cultivation

items:
  - kind: Culture
    id: middle-eastern
    name: Middle Eastern
    blurb: Sandstone, flat roofs and domes.
    tiers: { peasants: Farmers, citizens: Craftsmen, merchants: Merchants }
    luxury: { raw: coffee-cherries, good: coffee, garden: coffee-grove, producer: roastery }
    signature: caravanserai
    residentNames: [Amira, Bashir, Dalia, Farid, Ghada, Hadi, Imran, Jamila, Karim, Layla, Malik, Nadia,
                    Omar, Rania, Samir, Tariq, Yasmin, Zayd, Hala, Idris, Leena, Nabil, Salma, Yusuf]

  - { kind: Good, id: coffee-cherries, name: Coffee Cherries, unit: sacks, basePrice: 3 }
  - { kind: Good, id: coffee, name: Coffee, unit: sacks, basePrice: 16 }

  - kind: Building
    id: coffee-grove
    <<: *garden
    culture: middle-eastern
    recipe: { outputs: { coffee-cherries: 1 }, cycleTicks: 40 }

  - kind: Building
    id: roastery
    <<: *producer
    culture: middle-eastern
    recipe: { inputs: { coffee-cherries: 2 }, outputs: { coffee: 1 }, cycleTicks: 50 }

  # Sends caravans that sell a chosen good. Spec: culture-signatures /
  # The caravanserai exports a chosen good
  - kind: Building
    id: caravanserai
    effect: code
    culture: middle-eastern
    category: town
    footprint: [3, 3]
    cost: 200
    upkeep: 2
    buildTicks: 40
    storage: 16
    materials: { wood: 4, planks: 4 }
