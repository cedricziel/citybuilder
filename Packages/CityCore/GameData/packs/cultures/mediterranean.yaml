# yaml-language-server: $schema=../../schema/pack.schema.json
# Spec: cultures, culture-content, culture-signatures
defaults:
  garden: &garden
    category: gather
    crop: true                     # blight slows it (add-event-counterplay D6)
    footprint: [2, 2]
    cost: 60
    buildTicks: 25
    storage: 16
    materials: { wood: 2 }
    unlockedBy: cultivation
  producer: &producer
    category: craft
    footprint: [2, 2]
    cost: 120
    upkeep: 1
    buildTicks: 30
    storage: 16
    materials: { wood: 3, planks: 3 }
    unlockedBy: cultivation

items:
  - kind: Culture
    id: mediterranean
    name: Mediterranean
    blurb: Whitewashed walls, terracotta roofs and bell towers.
    tiers: { peasants: Plebeians, citizens: Citizens, merchants: Patricians }
    luxury: { raw: grapes, good: wine, garden: vineyard, producer: winery }
    signature: forum
    residentNames: [Aurelia, Bruno, Chiara, Dario, Elena, Fabio, Giulia, Iacopo, Livia, Marco, Nerina, Ottavio,
                    Paola, Quinto, Rosa, Sandro, Tullia, Ugo, Valeria, Zeno, Flavia, Lucio, Marta, Silvio]

  - { kind: Good, id: grapes, name: Grapes, unit: baskets, basePrice: 3, market: { sell: 20 } }
  - { kind: Good, id: wine, name: Wine, unit: amphorae, basePrice: 16, market: { sell: 20 } }

  - kind: Building
    id: vineyard
    <<: *garden
    culture: mediterranean
    recipe: { outputs: { grapes: 1 }, cycleTicks: 40 }

  - kind: Building
    id: winery
    <<: *producer
    culture: mediterranean
    recipe: { inputs: { grapes: 2 }, outputs: { wine: 1 }, cycleTicks: 50 }

  # Houses near a forum pay extra tax per resident, more while it is served.
  - kind: Building
    id: forum
    effect: code
    culture: mediterranean
    category: town
    footprint: [3, 3]
    cost: 220
    upkeep: 2
    buildTicks: 40
    storage: 16
    materials: { wood: 2, planks: 6 }
