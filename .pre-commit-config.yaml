default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 3 MB cap accommodates Phase 2 ambient/loop audio (e.g. a ~1.5 MB
        # sawmill loop). Source assets are CC0/CC-BY .caf or .m4a; anything
        # larger should be reviewed before committing.
        args: ["--maxkb=3072"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - revert

  - repo: local
    hooks:
      - id: swiftformat
        name: SwiftFormat (system binary, --lint)
        description: |
          Calls the Homebrew-installed swiftformat binary directly so hooks
          and `make format` use the exact same version. Avoids the
          multi-minute compile-from-source path taken by SwiftFormat's
          official pre-commit hook.
        entry: swiftformat --lint
        language: system
        types_or: [swift]
        require_serial: false

      - id: swiftlint
        name: SwiftLint (system binary, strict)
        description: |
          Calls the Homebrew-installed swiftlint binary directly. Same
          rationale as swiftformat above.
        entry: swiftlint --strict --quiet --force-exclude
        language: system
        types_or: [swift]
        require_serial: false

      - id: citycore-framework-free
        name: CityCore must not import Apple UI frameworks (design D1)
        entry: ./scripts/check-no-apple-ui-imports.sh
        language: system
        files: ^Packages/CityCore/Sources/.*\.swift$
        pass_filenames: false

      - id: check-cli-no-audio
        name: citybuilder-cli must not import audio frameworks (spec audio-playback)
        entry: ./scripts/check-cli-no-audio.sh
        language: system
        files: ^CLI/citybuilder-cli/.*\.swift$
        pass_filenames: false

      - id: check-ios-icon-opaque
        name: iOS app icon has no alpha channel (App Store Connect 90717)
        entry: ./scripts/check-ios-icon-opaque.sh
        language: system
        files: ^Apps/CitybuilderiOS/Assets\.xcassets/AppIcon\.appiconset/.*$
        pass_filenames: false

      - id: check-audio-manifest
        name: every bundled audio file has a manifest entry (spec audio-playback)
        entry: xcrun swift ./scripts/check-audio-manifest.swift
        language: system
        files: ^Resources/Audio/.*$
        pass_filenames: false

      - id: gamedata-check
        name: generated catalogs match the game-data packs (game-data-codegen)
        entry: make gamedata-check
        language: system
        files: ^Packages/(CityCore/(GameData/|Sources/CityCore/Generated/)|GameDataGen/Sources/)
        pass_filenames: false

      - id: l10n-check
        name: catalogs have reviewed German and follow the glossary (localization)
        entry: make l10n-check
        language: system
        files: (\.xcstrings$|^Packages/[^/]+/Sources/.*\.swift$|^Apps/.*\.swift$|^Tools/L10nCheck/)
        pass_filenames: false

      - id: forbid-xcodeproj
        name: Forbid committing generated Xcode project files
        entry: |
          bash -c 'for f in "$@"; do
            case "$f" in
              *.xcodeproj/*|*.xcworkspace/*|*.xcodeproj|*.xcworkspace)
                echo "Refused: $f is generated by xcodegen and must not be committed.";
                exit 1;;
            esac;
          done' --
        language: system
        pass_filenames: true

      - id: pre-push-swift-test
        name: Run CityCore tests before push
        entry: |
          bash -c 'if [ -d Packages/CityCore ]; then
            xcrun swift test --package-path Packages/CityCore;
          else
            echo "pre-push: CityCore package not yet present, skipping";
          fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
