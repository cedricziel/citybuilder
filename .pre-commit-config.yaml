default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/nicklockwood/SwiftFormat
    rev: 0.55.3
    hooks:
      - id: swiftformat
        args: ["--lint", "--strict"]

  - repo: https://github.com/realm/SwiftLint
    rev: 0.57.0
    hooks:
      - id: swiftlint
        args: ["--strict", "--quiet"]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - chore
          - docs
          - style
          - refactor
          - perf
          - test
          - build
          - ci
          - revert

  - repo: local
    hooks:
      - id: forbid-xcodeproj
        name: Forbid committing generated Xcode project files
        entry: |
          bash -c 'for f in "$@"; do
            case "$f" in
              *.xcodeproj/*|*.xcworkspace/*|*.xcodeproj|*.xcworkspace)
                echo "Refused: $f is generated by xcodegen and must not be committed.";
                exit 1;;
            esac;
          done' --
        language: system
        pass_filenames: true

      - id: pre-push-swift-test
        name: Run CityCore tests before push
        entry: bash -c 'swift test --package-path Packages/CityCore'
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
