included:
  - Apps
  - CLI
  - Packages

excluded:
  - .build
  - DerivedData
  - "**/.build"
  - Citybuilder.xcodeproj
  - Citybuilder.xcworkspace

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports
  - toggle_bool
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

analyzer_rules:
  - unused_import

disabled_rules:
  - todo

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - dx
    - dy

type_name:
  min_length: 3
  max_length:
    warning: 60
    error: 80

cyclomatic_complexity:
  warning: 12
  error: 20

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

reporter: "xcode"
