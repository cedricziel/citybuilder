name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Independent jobs run in parallel, so one failure no longer hides the
# rest. `ci-ok` is the single required check: add or rename jobs freely,
# as long as they stay in its `needs`.
jobs:
  lint:
    name: lint
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Homebrew tools
        run: brew install swiftlint swiftformat pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Scenario-to-test coverage report
        env:
          SCENARIO_COVERAGE_STRICT: "0"
        run: make test-scenarios

  test:
    name: test (${{ matrix.package }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [CityCore, CityPersistence, CityUI, CityRender2D, CityRender3D, CityAudio]

    steps:
      - name: Checkout (with full history for diff-cover)
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ matrix.package == 'CityCore' && '0' || '1' }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # CityRender2D's cutover test drives `make sprites-verify`, the
      # hermetic regen gate, so it needs the sprite pipeline's venv.
      - name: Install sprite pipeline libraries
        if: matrix.package == 'CityRender2D'
        run: brew install libimagequant jpeg-turbo

      - name: Set up Python for sprite pipeline
        if: matrix.package == 'CityRender2D'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bootstrap sprite venv
        if: matrix.package == 'CityRender2D'
        run: make sprites-venv

      - name: swift test
        env:
          # The hermetic gate must pass without an API key.
          OPENAI_API_KEY: ""
        run: swift test --package-path "Packages/${{ matrix.package }}" --enable-code-coverage

      - name: Coverage gate (CityCore floors + diff-cover vs main)
        if: matrix.package == 'CityCore'
        env:
          COVERAGE_BASE_REF: origin/main
          COVERAGE_STRICT: "1"
          COVERAGE_REUSE: "1"
        run: |
          pipx install diff-cover
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/check-coverage.sh

      - name: DeterminismFixture (macOS) — produce post-tick JSON
        if: matrix.package == 'CityCore'
        run: |
          mkdir -p determinism
          swift run --package-path Packages/CityCore DeterminismFixture > determinism/macos.json
          swift run --package-path Packages/CityCore DeterminismFixture 36000 > determinism/macos-36k.json
          shasum -a 256 determinism/macos.json determinism/macos-36k.json

      - name: Upload macOS determinism JSON
        if: matrix.package == 'CityCore'
        uses: actions/upload-artifact@v6
        with:
          name: determinism-macos
          path: determinism/macos*.json

      - name: Upload coverage report
        if: always() && matrix.package == 'CityCore'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  sprites:
    name: sprite pipeline pytest
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install sprite pipeline libraries
        run: brew install libimagequant jpeg-turbo

      - name: Set up Python for sprite pipeline
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bootstrap sprite venv
        run: make sprites-venv

      # The hermetic-regen check (`make sprites-verify`) runs inside the
      # CityRender2D tests; only the pipeline's own unit tests run here.
      - name: Sprite pipeline pytest
        env:
          OPENAI_API_KEY: ""
        run: make sprites-test

  build:
    name: build (${{ matrix.scheme }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: CitybuilderiOS
            destination: generic/platform=iOS Simulator
          - scheme: CitybuilderMac
            destination: platform=macOS
          - scheme: citybuilder-cli
            destination: platform=macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: make generate
        run: make generate

      - name: xcodebuild
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Citybuilder.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | xcbeautify --renderer github-actions

  determinism-linux:
    name: determinism — Linux toolchain build + fixture
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Print Swift version
        run: swift --version

      - name: swift test CityCore
        run: swift test --package-path Packages/CityCore

      - name: DeterminismFixture (Linux) — produce post-tick JSON
        run: |
          mkdir -p determinism
          swift run --package-path Packages/CityCore DeterminismFixture > determinism/linux.json
          swift run --package-path Packages/CityCore DeterminismFixture 36000 > determinism/linux-36k.json
          sha256sum determinism/linux.json determinism/linux-36k.json

      - name: Upload Linux determinism JSON
        uses: actions/upload-artifact@v6
        with:
          name: determinism-linux
          path: determinism/linux*.json

  determinism-compare:
    name: determinism — macOS vs Linux byte equality
    runs-on: ubuntu-latest
    needs: [test, determinism-linux]
    timeout-minutes: 5

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: determinism-macos
          path: determinism

      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: determinism-linux
          path: determinism

      - name: Diff macos.json vs linux.json
        run: |
          ls -la determinism/
          sha256sum determinism/*.json
          diff -q determinism/macos.json determinism/linux.json
          diff -q determinism/macos-36k.json determinism/linux-36k.json

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, sprites, build, determinism-linux, determinism-compare]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
