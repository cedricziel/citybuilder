name: ci

on:
  # A push to main selects jobs from the files it changed, like a PR.
  push:
    branches: [main]
  # Every PR, including one stacked on another PR's branch.
  pull_request:
  # Selective pushes skip jobs, so main also gets a full run every week.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer run replaces an older one on the same ref, main included: a
# push to main diffs against the last green run, so a cancelled push's
# changes fall inside the next push's diff. The weekly and manual runs
# get their own group so a push can't cancel the full run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Independent jobs run in parallel, so one failure no longer hides the
# rest. `ci-ok` is the single required check: add or rename jobs freely,
# as long as they stay in its `needs`.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `actions: read` lets the push case look up the last green run.
    permissions:
      contents: read
      actions: read
    outputs:
      packages: ${{ steps.select.outputs.packages }}
      test_matrix: ${{ steps.select.outputs.test_matrix }}
      apps: ${{ steps.select.outputs.apps }}
      sprites: ${{ steps.select.outputs.sprites }}
      gamedata_fixture: ${{ steps.select.outputs.gamedata_fixture }}
      determinism_linux: ${{ steps.select.outputs.determinism_linux }}
      determinism_compare: ${{ steps.select.outputs.determinism_compare }}
      audio: ${{ steps.select.outputs.audio }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Docs need lint only. A change inside Packages/ runs that package
      # and its dependents, read from the Package.swift graph; anything
      # else runs everything (see scripts/select_ci_jobs.py).
      #
      # A PR diffs against its base. A push to main diffs against the head
      # of the latest green run on main, not against the commit before
      # it: that run may have failed, and a later docs-only push must not
      # turn main green while a package is still broken. Everything is
      # selected, in shell, when there is nothing to diff against (the
      # weekly schedule, a manual run, no green run yet, a green commit
      # that is not in the checkout, a failing API call) and when the
      # change edits the selector, its tests or this workflow, so a
      # broken selector can't deselect the jobs that would test it.
      - name: Select jobs from the changed files
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          select_all() {
            for manifest in Packages/*/Package.swift; do basename "$(dirname "$manifest")"; done > "$RUNNER_TEMP/packages"
            echo "packages=$(jq -Rsc 'split("\n")[:-1]' "$RUNNER_TEMP/packages")"
            echo "apps=true"
            echo "sprites=true"
            echo "gamedata_fixture=true"
            echo "determinism_linux=true"
            echo "determinism_compare=true"
            echo "audio=true"
          }
          case "$EVENT_NAME" in
            pull_request) BASE_SHA="$PR_BASE_SHA" ;;
            push)
              BASE_SHA=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" \
                --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule")][0].head_sha // empty') \
                || BASE_SHA=""
              ;;
            *) BASE_SHA="" ;;
          esac
          if ! git cat-file -e "${BASE_SHA:-HEAD}^{commit}" 2>/dev/null; then
            BASE_SHA=""
          fi
          selection="$RUNNER_TEMP/selection"
          if [ -z "$BASE_SHA" ]; then
            select_all > "$selection"
          else
            git diff --no-renames --name-only "$BASE_SHA" HEAD | tee "$RUNNER_TEMP/changed-files"
            if grep -qxE 'scripts/select_ci_jobs\.py|scripts/tests/test_select_ci_jobs\.py|\.github/workflows/ci\.yml' "$RUNNER_TEMP/changed-files"; then
              select_all > "$selection"
            else
              python3 scripts/select_ci_jobs.py < "$RUNNER_TEMP/changed-files" > "$selection"
            fi
          fi
          cat "$selection"
          cat "$selection" >> "$GITHUB_OUTPUT"

          # Four small packages share one test job, since each job pays
          # for a runner, a checkout and an Xcode setup; the others keep
          # their own. The count check makes a bad grouping fail loudly
          # rather than drop a package from the matrix.
          packages=$(sed -n 's/^packages=//p' "$selection")
          matrix=$(jq -c '
            map({package: ., group: (if IN("CityAudio", "CityPersistence", "CityRender3D", "GameDataGen") then "small" else . end)})
            | group_by(.group)
            | map({name: (map(.package) | join(", ")), packages: (map(.package) | join(" "))})
          ' <<< "$packages")
          if [ "$(jq 'map(.packages | split(" ") | length) | add // 0' <<< "$matrix")" != "$(jq length <<< "$packages")" ]; then
            echo "::error::test matrix does not cover the selected packages: $packages -> $matrix"
            exit 1
          fi
          echo "test_matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  # The sound generator and the music renderer promise the same bytes on
  # every machine; the sprite pipeline's pytest job checks them on macOS,
  # this checks them on Linux.
  audio-linux:
    name: audio renders match on Linux
    needs: changes
    if: needs.changes.outputs.audio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install numpy (pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/audio"
          "$RUNNER_TEMP/audio/bin/pip" install --quiet "numpy==$(sed -n 's/^numpy==//p' scripts/requirements.txt)"
      - name: Sounds and music match their recipes
        run: make audio-check music-check PYTHON="$RUNNER_TEMP/audio/bin/python"

  lint:
    name: lint
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Pinned and checksummed: runner images carry different SwiftFormat
      # releases, which disagree on rules such as docComments.
      - name: Install pinned lint tools
        run: scripts/ci/install-pinned-tools.sh lint

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: pre-commit run --all-files
        run: pre-commit run --all-files --show-diff-on-failure

      # Two PRs that each fit under SwiftLint's file_length limit can go
      # over it once both merge, failing lint for everyone. This warns at
      # 450 lines; it never fails the job.
      - name: Warn about Swift files near the length limit
        if: always()
        run: scripts/check-file-length-headroom.sh

      - name: Scenario-to-test coverage report
        env:
          SCENARIO_COVERAGE_STRICT: "0"
        run: make test-scenarios

  # CityCore, CityRender2D and CityUI are big enough to keep their own
  # job; the rest share one (see `test_matrix` in `changes`). A job's
  # `packages` is a space-separated list, tested one `swift test` each.
  test:
    name: test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.test_matrix != '[]'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.test_matrix) }}

    steps:
      - name: Checkout (with full history for diff-cover)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.packages == 'CityCore' && '0' || '1' }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # CityRender2D's cutover test drives the byte half of
      # `make sprites-verify`, the hermetic regen gate, so it needs the
      # sprite pipeline's venv.
      - name: Install sprite pipeline libraries
        if: matrix.packages == 'CityRender2D'
        # libimagequant decides the atlas PNG bytes, so it is pinned.
        run: scripts/ci/install-pinned-tools.sh sprites

      - name: Set up Python for sprite pipeline
        if: matrix.packages == 'CityRender2D'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bootstrap sprite venv
        if: matrix.packages == 'CityRender2D'
        run: make sprites-venv

      # A failing package doesn't stop the next, so one run reports every
      # broken package; the step fails at the end if any did.
      - name: swift test
        env:
          # The hermetic gate must pass without an API key.
          OPENAI_API_KEY: ""
          PACKAGES: ${{ matrix.packages }}
        run: |
          failed=""
          for package in $PACKAGES; do
            echo "==> swift test $package"
            swift test --package-path "Packages/$package" --enable-code-coverage \
              || failed="$failed $package"
          done
          if [ -n "$failed" ]; then
            echo "::error::swift test failed for:$failed"
            exit 1
          fi

      # PNG bytes depend on the encoder's zlib, so a sprite made on another
      # OS can fail the byte-exact gate. Regenerate here and upload the
      # atlases, so they can be committed as CI encodes them.
      - name: Regenerate atlases after a sprite gate failure
        if: failure() && matrix.packages == 'CityRender2D'
        run: make sprites-offline

      - name: Upload regenerated atlases
        if: failure() && matrix.packages == 'CityRender2D'
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-atlases
          path: Resources/*.atlas/

      - name: gamedata-check (committed catalogs match the packs)
        if: contains(matrix.packages, 'GameDataGen')
        run: make gamedata-check SWIFT=swift

      # Second half of `make sprites-verify`: the CityRender2D tests run
      # the byte check (`make sprites-regen-check`), this runs the content
      # gate once, outside `swift test`.
      - name: Sprite content gate
        if: matrix.packages == 'CityRender2D'
        run: make sprites-content

      - name: Coverage gate (CityCore floors + diff-cover vs the base branch)
        if: matrix.packages == 'CityCore'
        env:
          COVERAGE_BASE_REF: origin/${{ github.base_ref || 'main' }}
          COVERAGE_STRICT: "1"
          COVERAGE_REUSE: "1"
        run: |
          pipx install diff-cover
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/check-coverage.sh

      - name: DeterminismFixture (macOS) — produce post-tick JSON
        if: matrix.packages == 'CityCore'
        env:
          # The fixture dumps Dictionary-backed state, whose iteration
          # order is seeded per process unless hashing is pinned.
          SWIFT_DETERMINISTIC_HASHING: "1"
        run: |
          mkdir -p determinism
          swift run --package-path Packages/CityCore DeterminismFixture > determinism/macos.json
          swift run --package-path Packages/CityCore DeterminismFixture 36000 > determinism/macos-36k.json
          shasum -a 256 determinism/macos.json determinism/macos-36k.json

      - name: Upload macOS determinism JSON
        if: matrix.packages == 'CityCore'
        uses: actions/upload-artifact@v7
        with:
          name: determinism-macos
          path: determinism/macos*.json

      - name: Upload coverage report
        if: always() && matrix.packages == 'CityCore'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  sprites:
    name: sprite pipeline pytest
    needs: changes
    if: needs.changes.outputs.sprites == 'true'
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install sprite pipeline libraries
        # libimagequant decides the atlas PNG bytes, so it is pinned.
        run: scripts/ci/install-pinned-tools.sh sprites

      # The terrain-tile seam test renders SVG with rsvg-convert. Its bytes are
      # never committed from CI, so it is not pinned.
      - name: Install rsvg-convert
        run: brew install librsvg

      - name: Set up Python for sprite pipeline
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bootstrap sprite venv
        run: make sprites-venv

      # The hermetic-regen check (`make sprites-verify`) runs inside the
      # CityRender2D tests; only the pipeline's own unit tests run here.
      - name: Sprite pipeline pytest
        env:
          OPENAI_API_KEY: ""
        run: make sprites-test

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # IsoKit's recipe, catalog and cell-fit tests. GPU renders vary between runs
      # and machines (design D5), so CI never renders: ISOKIT_SKIP_RENDER skips
      # the render suite, and `make sprites-art-verify` runs only on a Mac.
      - name: IsoKit tests (no rendering)
        env:
          ISOKIT_SKIP_RENDER: "1"
        run: swift test --package-path Tools/IsoKit

  # One runner builds every scheme in turn, into one DerivedData, so
  # `make generate`, XcodeGen and the package resolution run once and the
  # macOS app and the CLI share their compiled package products. Each
  # scheme is its own step that runs even when an earlier one failed, so
  # one run reports every broken scheme; `Summarize builds` then fails
  # the job with the list.
  build:
    name: build (iOS, Mac, tvOS, cli)
    needs: changes
    if: needs.changes.outputs.apps == 'true'
    runs-on: macos-26
    # The four old jobs took 1 to 4 minutes each (3.7 at most) in recent
    # runs; the budget covers all four plus a cold tvOS runtime download.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: scripts/ci/install-pinned-tools.sh xcodegen

      - name: make generate
        id: generate
        run: make generate

      - name: Build CitybuilderiOS
        id: ios
        run: scripts/ci/xcodebuild-scheme.sh CitybuilderiOS "generic/platform=iOS Simulator"

      - name: Build CitybuilderMac
        id: mac
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: scripts/ci/xcodebuild-scheme.sh CitybuilderMac "platform=macOS"

      - name: Build citybuilder-cli
        id: cli
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: scripts/ci/xcodebuild-scheme.sh citybuilder-cli "platform=macOS"

      # Only the tvOS build needs the runtime, so the download comes
      # last and a failed iOS or Mac build doesn't wait for it.
      - name: Install the tvOS simulator runtime when missing
        id: tvos_runtime
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: |
          xcrun simctl list runtimes | grep -q tvOS || xcodebuild -downloadPlatform tvOS

      - name: Build CitybuilderTV
        id: tvos
        if: ${{ !cancelled() && steps.tvos_runtime.outcome == 'success' }}
        run: scripts/ci/xcodebuild-scheme.sh CitybuilderTV "generic/platform=tvOS Simulator"

      - name: Summarize builds
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: >-
            generate=${{ steps.generate.outcome }}
            CitybuilderiOS=${{ steps.ios.outcome }}
            CitybuilderMac=${{ steps.mac.outcome }}
            citybuilder-cli=${{ steps.cli.outcome }}
            tvOS-runtime=${{ steps.tvos_runtime.outcome }}
            CitybuilderTV=${{ steps.tvos.outcome }}
        run: |
          failed=""
          for outcome in $OUTCOMES; do
            echo "$outcome"
            case "$outcome" in
              *=success) ;;
              *) failed="$failed ${outcome%%=*}" ;;
            esac
          done
          if [ -n "$failed" ]; then
            echo "::error::did not succeed:$failed"
            exit 1
          fi

  gamedata-fixture:
    name: gamedata — a fixture pack builds without Swift edits
    needs: changes
    if: needs.changes.outputs.gamedata_fixture == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate with the fixture pack and build CityCore, CityUI and CityRender2D
        env:
          SWIFT: swift
        run: ./scripts/check-gamedata-fixture-build.sh

  determinism-linux:
    name: determinism — Linux toolchain build + fixture
    needs: changes
    if: needs.changes.outputs.determinism_linux == 'true'
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Print Swift version
        run: swift --version

      - name: swift test CityCore
        run: swift test --package-path Packages/CityCore

      - name: swift test GameDataGen
        run: swift test --package-path Packages/GameDataGen

      # Same command as `make gamedata-check`; the container has no make.
      - name: gamedata-check (committed catalogs match the packs)
        run: swift run -q --package-path Packages/GameDataGen gamedata-gen generate --check

      - name: DeterminismFixture (Linux) — produce post-tick JSON
        env:
          # The fixture dumps Dictionary-backed state, whose iteration
          # order is seeded per process unless hashing is pinned.
          SWIFT_DETERMINISTIC_HASHING: "1"
        run: |
          mkdir -p determinism
          swift run --package-path Packages/CityCore DeterminismFixture > determinism/linux.json
          swift run --package-path Packages/CityCore DeterminismFixture 36000 > determinism/linux-36k.json
          sha256sum determinism/linux.json determinism/linux-36k.json

      - name: Upload Linux determinism JSON
        uses: actions/upload-artifact@v7
        with:
          name: determinism-linux
          path: determinism/linux*.json

  determinism-compare:
    name: determinism — macOS vs Linux byte equality
    runs-on: ubuntu-latest
    needs: [changes, test, determinism-linux]
    if: needs.changes.outputs.determinism_compare == 'true'
    timeout-minutes: 5

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: determinism-macos
          path: determinism

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: determinism-linux
          path: determinism

      - name: Diff macos.json vs linux.json
        run: |
          ls -la determinism/
          sha256sum determinism/*.json
          diff -q determinism/macos.json determinism/linux.json
          diff -q determinism/macos-36k.json determinism/linux-36k.json

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, test, sprites, audio-linux, build, gamedata-fixture, determinism-linux, determinism-compare]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A job skips only when `changes` deselects it, so a skip counts
      # only after `changes` succeeded. If the selection itself failed
      # or was skipped, nothing passes.
      - name: Require every selected job to succeed
        env:
          SELECTION: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "selection: $SELECTION; job results: $RESULTS"
          [ "$SELECTION" = "success" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = "success" ] || [ "$result" = "skipped" ] || exit 1
          done
