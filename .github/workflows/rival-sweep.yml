name: rival-sweep

# The full rival viability sweep (rival-ai-viability design D7): seeds
# 0–9 at every difficulty over 36,000 ticks, with the year-5 floors.
# Too slow for every PR, so it runs weekly and on demand. It is not a
# required check and not part of `ci-ok`.
on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  sweep:
    name: rival viability sweep
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run the sweep (release build)
        env:
          RIVAL_SWEEP: "1"
        shell: bash
        run: |
          set -o pipefail
          swift test -c release -Xswiftc -enable-testing --package-path Packages/CityCore \
            --filter scenarioRivalsAreViableAcrossSeeds 2>&1 | tee rival-sweep.log
          grep '^RIVAL_SWEEP' rival-sweep.log > rival-sweep.txt

      - name: Upload the sweep's per-rival lines
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rival-sweep
          path: rival-sweep.txt
