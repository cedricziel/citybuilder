version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      sprite-pipeline:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /design/web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      design-web:
        patterns: ["*"]
